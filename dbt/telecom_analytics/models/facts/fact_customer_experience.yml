version: 2

models:
  - name: fact_customer_experience
    description: "One row per customer experience record."

    columns:
      - name: cx_key
        data_tests:
          - unique
          - not_null

      - name: cx_id
        data_tests:
          - unique
          - not_null

      - name: customer_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_key

      - name: plan_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_plan')
                field: plan_key

      - name: service_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_service')
                field: service_key

      - name: date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key