version: 2

models:
  - name: fact_network_event
    description: "One row per network event, loaded incrementally."

    columns:
      - name: event_key
        data_tests:
          - unique
          - not_null

      - name: event_id
        data_tests:
          - unique
          - not_null

      - name: tower_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_tower')
                field: tower_key

      - name: area_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_area')
                field: area_key

      - name: date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

      - name: incident_type_key
        description: "Nullable for events without an incident type."
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_incident_type')
                field: incident_type_key