version: 2

models:
  - name: dim_customer
    description: "Customer dimension for telecom customer analysis."

    columns:
      - name: customer_key
        description: "Deterministic surrogate key derived from customer_id."
        data_tests:
          - unique
          - not_null

      - name: customer_id
        description: "Original customer business key."
        data_tests:
          - unique
          - not_null

      - name: area_key
        description: "Foreign key referencing DIM_AREA."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_area')
                field: area_key

      - name: customer_name
        description: "Customer name."

      - name: age
        description: "Customer age. NULL values are preserved."

      - name: age_group
        description: "Cleaned age group generated by Spark."
        data_tests:
          - not_null

      - name: segment
        description: "Customer segment. NULL values are allowed."

      - name: subscription_status
        description: "Current subscription status."
        data_tests:
          - not_null

      - name: activation_date
        description: "Customer subscription activation date."

      - name: churn_date
        description: "Subscription cancellation date, where applicable."

      - name: last_updated_at
        description: "Last update timestamp."