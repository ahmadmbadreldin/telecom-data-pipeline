version: 2

models:
  - name: dim_service
    description: "Telecom services dimension."

    columns:
      - name: service_key
        description: "Deterministic surrogate key generated from service_id."
        data_tests:
          - unique
          - not_null

      - name: service_id
        description: "Original business key of the service."
        data_tests:
          - unique
          - not_null

      - name: service_name
        description: "Name of the telecom service."
        data_tests:
          - not_null

      - name: service_category
        description: "Category of the service."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Internet', 'Data', 'Voice']

      - name: technology
        description: "Technology used by the service."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['5G', 'LTE', 'FIBER']

      - name: description
        description: "Description of the service."

      - name: is_active
        description: "Whether the service is active."
        data_tests:
          - not_null